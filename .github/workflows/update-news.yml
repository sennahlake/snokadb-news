name: Update news

on:
  schedule:
    # Public repos get free Actions minutes; hourly is enough for news.
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate news feed and archives
        run: npm run generate

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json rss.xml archive data/player-index.json
          if git diff --staged --quiet; then
            echo "No news changes"
            exit 0
          fi
          git commit -m "Update news feed from RSS/API"
          git push
